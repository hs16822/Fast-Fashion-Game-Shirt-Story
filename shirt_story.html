function audio(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();sg=ac.createGain();mg.connect(ac.destination);sg.connect(ac.destination)}ac.resume();gains();if(!musicTimer)musicTimer=setInterval(()=>{if(!prefs.music||document.hidden)return;let n=melody[noteIndex++%melody.length];tone(n,.95,mg,.13);if(noteIndex%4===1)tone(n-12,1.9,mg,.08)},470)}catch(e){}}
function gains(){if(mg)mg.gain.setTargetAtTime(prefs.music?prefs.mv:0,ac.currentTime,.1);if(sg)sg.gain.value=prefs.sfx?prefs.sv:0}
function tone(n,d,out,v=.18){if(!ac)return;let osc=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;osc.type='sine';osc.frequency.value=440*Math.pow(2,(n-69)/12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);osc.connect(g);g.connect(out);osc.start(t);osc.stop(t+d+.03);osc.onended=()=>{osc.disconnect();g.disconnect()}}
function sound(type='click'){if(!prefs.sfx)return;audio();if(!sg)return;tone(type==='warn'?48:76,.25,sg);if(type==='water'){for(let i=0;i<5;i++)setTimeout(()=>tone(55+i*4,.25,sg,.1),i*85)}}
function chosen(key,s=state){return chapters.find(c=>c.key===key).options[s.choices[key]]}
function calc(s=state){let v=[65,45,60,50];for(const c of chapters){let o=chosen(c.key,s);if(o)o.d.forEach((x,i)=>v[i]+=x)}if(s.choices.material===4&&s.choices.end===2){v[0]-=7}return v.map(x=>Math.max(0,Math.min(100,x)))}
function stock(s=state){let q=chosen('quantity',s)?.qty||0,demand=360+([100,70,120,180,-40][s.choices.trend]||0);let sold=Math.min(q,Math.max(0,demand));let before=q-sold,newQty=s.choices.event===1?2000:0;let extra=s.choices.event===0?Math.round(before*.35):s.choices.event===2?Math.round(before*.15):s.choices.event===3?Math.round(before*.45):0;return{q,total:q+newQty,sold:sold+extra+(newQty?700:0),old:before-extra,newStock:newQty?1300:0,before,left:before-extra+(newQty?1300:0)}}

function finishThink(buy){state.thought=buy?'Thought, then bought':'Thought, did not buy';thinking=false;commit(buy?1:2)}
function commit(i){if(state.result)return;delete state.pending;const c=chapters[state.index];let prev=calc();state.choices[c.key]=i;state.result=true;sound(c.key==='color'?'water':c.key==='event'?'warn':'click');render();let dest=calc(),start=performance.now();if(!prefs.reduce){function frame(t){let f=Math.min(1,(t-start)/650);let el=$('#v0');if(el)el.innerHTML=Math.round(prev[0]+(dest[0]-prev[0])*f)+'<span style="font-size:11px;font-weight:400"> /100</span>';if(f<1&&state.result)requestAnimationFrame(frame)}requestAnimationFrame(frame)}save()}

function finale(){clearInterval(countdownTimer);const changed=baseline&&(JSON.stringify(baseline.choices)!==JSON.stringify(state.choices)||baseline.color!==state.color);let diff=changed?(chapters.find(c=>baseline.choices[c.key]!==state.choices[c.key])||chapters[1]):null;app.innerHTML=`<div class="finalhero"><div><div class="eyebrow">THE LIFE OF YOUR CLOTHES</div><h2>每個選擇，<br>都成為衣服故事的一部分。</h2><p class="sub">Every choice becomes part of the story.</p>${state.choices.buy===2?'<p>你沒有買新衣，使用故事轉向原有衣服；前面模擬製造的新衣仍計入市場供應。</p>':''}</div>${shirt()}</div>${changed?`<div class="result"><div class="eyebrow">ONE CHANGE</div><h3>${diff.zh}</h3><p>${chosen(diff.key,baseline).en} → <b>${chosen(diff.key).en}</b></p><p>只改一個決定，結果有什麼不同？</p></div><div class="compare">${card(baseline,'原本的決定 Before')}${card(state,'改變之後 After')}</div>`:`<div class="compare">${card(state,'你們的故事 Your story')}<div><h3>沒賣完的衣服去哪裡了？</h3><div class="sub">Where is the stock?</div><p>沒賣出的 <b>${stock().left.toLocaleString()}</b> 件衣服，仍然留在系統裡。</p><p>庫存不等於已被丟掉。遊戲不會假裝知道它們最後全都去了哪裡。</p><p class="note">數量採固定模擬需求，讓重玩比較保持一致。</p></div></div>`}<button class="primary" onclick="replay()">▶ 播放衣服的旅行</button>${timeline(state)}<section class="reveal"><div class="eyebrow" style="color:#d6e3b9">WHAT DID WE JUST EXPLORE?</div><h2>快時尚</h2><div class="sub" style="color:#dceacc">Fast fashion</div><p>Fast fashion makes many trendy clothes quickly and cheaply.</p><p>快速、大量地製作便宜、追逐流行的衣服。</p><p>更快更新 → 更多製作 → 更常促銷 → 更快淘汰</p><small>不論你的路線快或慢，我們探索的都是這個循環，以及改變它的選擇。</small></section><h3>改變一個選擇</h3><div class="sub">Change one choice.</div><p>只能先改一個決定，看看結果如何變化。其他選擇維持第一輪設定。</p><div class="choices">${chapters.map((c,i)=>`<button onclick="edit(${i})" class="choice"><span><b>${chapterZh[i]}</b><small>${chosen(c.key,baseline||state)?.zh} · ${chosen(c.key,baseline||state)?.en}</small></span><span class="arrow">→</span></button>`).join('')}</div><div class="result" style="margin-top:25px"><h3>購買之前，先想一想</h3><div class="sub">Before you buy…</div><p>Do I need it? 我真的需要嗎？<br>Will I wear it many times? 我會穿很多次嗎？<br>Can I use what I have? 我能繼續用原本的嗎？</p><button class="primary" onclick="start()">開始新故事</button> <button onclick="lobby()">回大廳</button></div>${foot()}`}

function credits(){modal.innerHTML=`<h2>About this story</h2><div class="sources"><p>以衣服生命週期為主軸的課堂討論遊戲。英文按鈕搭配繁體中文解說，建議全班一起討論選擇。</p><p><b>指數怎麼看？</b><br>ECO：遊戲設定的環境取捨；LIFE：耐穿潛力；SPEED：上市速度；PRICE：相對單件成本。高低不是總體好壞評分，亦非科學 LCA。</p><p><b>固定模擬市場</b><br>需求 = 360 + 行銷效果（100／70／120／180／−40）。舊款售量不超過產量。事件可售出剩餘庫存的 35%／0%／15%／45%；追加新款固定 2,000 件、售出 700 件。未售出不代表已丟棄。</p><p><b>圖片</b>：直接嵌入 Pexels 照片，需網路載入；讀取失敗時保留完整 SVG 插畫。照片為情境示意，人物與商店並非遊戲中負面行為的指涉。</p><ul><li><a target="_blank" rel="noopener" href="https://www.pexels.com/photo/woman-picking-up-cotton-on-field-6196400/">Cotton harvest · Canan YAŞAR</a></li><li><a target="_blank" rel="noopener" href="https://www.pexels.com/photo/clothes-racks-in-a-boutique-5424922/">Clothes racks · Pexels</a></li><li><a target="_blank" rel="noopener" href="https://www.pexels.com/photo/a-port-with-shipping-containers-and-cranes-13025947/">Shipping port · Pexels</a></li><li><a target="_blank" rel="noopener" href="https://www.pexels.com/license/">Pexels license</a></li></ul><p>教學背景：<a href="https://www.unep.org/news-and-stories/story/environmental-costs-fast-fashion" target="_blank" rel="noopener">UNEP · The environmental costs of fast fashion</a>。實際影響需完整生命週期分析，模擬分數不代表各材料的通用排名。</p><p>SVG 插畫、程式旋律與音效為本遊戲生成，未使用外部歌曲。使用者提供的參考圖僅作風格參考，未嵌入有浮水印的圖片。</p><p>故事式互動參考：<a href="https://globalgoalscentre.itch.io/threads" target="_blank" rel="noopener">Threads · Global Goals Centre</a>；本遊戲不使用其程式、角色或音樂。</p></div><button class="primary" onclick="modal.close()">Back</button>`;modal.showModal()}

}else if(key==='trend'){const symbols=['⭐','⏳','🗓️','💰','🧵'];a=`<rect x="18" y="19" width="83" height="79" rx="15" fill="#fffdf3"/><text x="60" y="74" font-size="46" text-anchor="middle">${symbols[i]}</text>${arrow}${miniature(173,21,['#f6bb54','#ef8269','#ab93d1','#70bcc9','#8ac46e'][i],.8)}`;
}else if(key==='event'){a=`${miniature(28,25,'#d9b483',.7)}${arrow}`;if(i===0)a+='<path d="M160 35h63v58h-63l-17-29Z" fill="#ef8156"/><text x="188" y="76" font-size="27" fill="white" text-anchor="middle">SALE</text>';if(i===1)a+=miniature(178,25,'#b388d0',.7)+'<text x="124" y="92" font-size="24" fill="#51735a">＋</text>';if(i===2)a+='<path d="M158 96V44h70v52" fill="#a9d4b0" stroke="#397361" stroke-width="3"/><path d="M148 43l13-22h64l13 22Z" fill="#eaa14e"/>';if(i===3)a+=miniature(176,25,'#d9b483',.7)+'<rect x="195" y="59" width="18" height="20" fill="#99c77b" stroke="#477260" stroke-dasharray="3 2"/>';
}else if(key==='travel'){if(i===0)a='<path d="M20 69l95-17 33-36 16 4-14 36 77 20-6 13-82-8-22 21-13-4 9-22-88 8Z" fill="#76b7d1" stroke="#346d80" stroke-width="3"/>';if(i===1)a='<path d="M26 72h215l-34 30H59Z" fill="#508eb5"/><path d="M57 70V42h45v28m5 0V42h45v28m5 0V42h45v28" fill="#ef9a4d" stroke="#ad6839" stroke-width="2"/><path d="M18 109q20-10 40 0t40 0t40 0t40 0t40 0" stroke="#66b9d2" stroke-width="4" fill="none"/>';if(i===2)a='<path d="M26 100V49l50-26 25 26v51Z" fill="#efbd6d"/><path d="M176 100V49l30-24 29 24v51Z" fill="#78bca3"/><path d="M107 79h55m-12-8 12 8-12 8" stroke="#59826a" stroke-width="4" fill="none"/>';
}else if(key==='buy'){a=`${miniature(30,22,'#e69a64',.8)}${arrow}<circle cx="196" cy="62" r="37" fill="#fffdf5"/><text x="196" y="79" text-anchor="middle" font-size="46">${['🛒','🤔','🏠'][i]}</text>`;
}else if(key==='end'){a=`${miniature(29,22,'#e69a64',.8)}${arrow}`;if(i===5||i===3)a+=miniature(177,22,i===3?'#8fc18a':'#e69a64',.8)+'<rect x="192" y="60" width="20" height="23" fill="#8cbfe0" stroke="#3c6f72" stroke-dasharray="3 2"/>';else a+=`<circle cx="197" cy="62" r="38" fill="#fffdf5"/><text x="197" y="78" text-anchor="middle" font-size="44">${['🗑️','🎁','♻️','','👕'][i]}</text>`}
return `<svg class="choice-image" viewBox="0 0 260 120" role="img" aria-label="${chapters.find(c=>c.key===key).options[i].zh}的示意圖"><rect width="260" height="120" rx="13" fill="${bg}"/><g class="illustration-move">${a}</g></svg>`}
function hud(){const v=calc();return `<div class="hud" aria-label="點選指數查看意義">${indicators.map((k,i)=>`<button type="button" onclick="explainIndicator(${i})" aria-label="${k.zh}指數說明"><small><span class="emoji">${k.emoji}</span> ${k.zh} ⓘ</small><span class="hud-en">${k.en}</span><b id="v${i}">${v[i]}<span style="font-size:11px;font-weight:400"> /100</span></b><progress max="100" value="${v[i]}"></progress></button>`).join('')}</div>`}
function choicesHTML(c){let parts=c.prompt.match(/^([\s\S]*?[.!?])\s+([\s\S]+)$/);let chinese=parts?parts[2]:c.prompt,english=parts?parts[1]:'';return `<h2>${c.zh}</h2><div class="sub">${c.title}</div>${c.key==='event'?`<p class="prompt">還有 <strong style="color:var(--orange)">${stock().before.toLocaleString()}</strong> 件舊款沒有賣出。<span class="en-sub">${stock().before.toLocaleString()} shirts are still in stock.</span></p>`:`<p class="prompt">${chinese}<span class="en-sub">${english}</span></p>`}${c.key==='color'?`<div class="dye-swatch" aria-label="衣服顏色">${['#ed7152','#479dcc','#eebd37','#a86bd0'].map((co,i)=>`<button class="swatch ${co===state.color?'active':''}" data-color="${co}" aria-label="${['珊瑚橘','天空藍','向日葵黃','葡萄紫'][i]}" style="background:${co}"></button>`).join('')}</div>`:''}<div class="choices option-grid count-${c.options.length}">${c.options.map((o,i)=>`<div class="choice-card ${o.special?'special':''} ${state.pending===i?'is-selected':''}"><button class="choice" data-choice="${i}" aria-pressed="${state.pending===i}" aria-label="選擇：${o.zh}"><span class="selection-check" aria-hidden="true">✓</span>${optionArt(c.key,i)}<b>${o.zh}</b><small>${o.en}</small></button><button class="choice-info" type="button" onclick="explainChoice('${c.key}',${i})" aria-label="${o.zh}：補充說明">※</button></div>`).join('')}</div><div class="submit-bar"><span id="selection-status" aria-live="polite">${state.pending===undefined?'請先選一個選項':'已選：'+c.options[state.pending].zh}</span><button class="primary" id="submit-choice" onclick="submitChoice()" ${state.pending===undefined?'disabled':''}>送出選擇 →</button></div><p class="note">先點選，再按送出。※ 只開啟補充說明。</p>${c.key==='buy'?'<p class="note">⏳ 倒數只是廣告效果，時間到了仍可慢慢選。</p>':''}`}
function explainChoice(key,index){const c=chapters.find(x=>x.key===key),o=c.options[index];const words=[wordNotes[key][0][index],...wordNotes[key][1]];const questions={material:'材料便宜，但以後不好回收，你會怎麼選？',color:'除了顏色漂亮，還可以注意哪些製作方式？',speed:'快一點和仔細一點，你想怎麼安排？',quantity:'如果不知道有多少人需要，你會先做多少？',trend:'這個廣告讓你「想要」，還是讓你發現自己「需要」？',event:'新的流行出現後，原本的衣服還可以怎麼辦？',travel:'如果沒有急著要這件衣服，可以怎麼運送？',buy:'沒有折扣、沒有倒數時，你還會做同樣的決定嗎？',end:'這件衣服還能被誰、用什麼方式繼續使用？'};modal.innerHTML=`<div class="eyebrow">※ 選擇補充 · LEARN MORE</div><h2>${o.zh}</h2><div class="sub">${o.en}</div><div class="help-hero">${optionArt(key,index)}</div><section class="help-section"><h3>🔎 補充說明</h3><p>${o.why}</p><div class="sub">${o.line}</div>${key==='end'&&index===2&&state.choices.material===4?'<p style="background:#ffe4b9;padding:12px;border-radius:10px">🧵 你先前選了混紡：不同纖維較難分離，這次的回收可能遇到困難。</p>':''}</section>${key==='material'?`<section class="help-section"><h3>📖 材料生字小幫手</h3>${words.map(w=>{let [zh,en,def]=w.split('|');return `<div class="word-row"><div><b>${zh}</b><small>${en}</small></div><span>${def}</span></div>`}).join('')}</section>`:''}<div class="help-question">💬 想一想：${questions[key]}</div><p class="note">補充說明不會改變選擇或指數。返回後，仍可自由決定。</p><div class="help-bottom"><button class="primary" onclick="modal.close()">看懂了，返回選擇</button></div>`;modal.showModal();modal.scrollTop=0}
function explainIndicator(i){const k=indicators[i],v=calc()[i];modal.innerHTML=`<div class="eyebrow">指數說明 · INDICATOR</div><h2>${k.emoji} ${k.title}</h2><div class="sub">${k.en}</div><div class="help-question">目前：<b>${v} / 100</b></div><section class="help-section"><h3>它在說什麼？</h3><p>${k.meaning}</p><p>⬆️ ${k.high}<br>⬇️ ${k.low}</p></section><section class="help-section"><h3>例如……</h3><p>${k.example}</p><p>📖 ${k.word}</p></section><p class="note">四個指數呈現不同取捨，並非全部越高越好。這些數值是教學模擬，不能當作真實環境評估、壽命或價格。</p><div class="help-bottom"><button class="primary" onclick="modal.close()">看懂了，返回故事</button></div>`;modal.showModal();modal.scrollTop=0}


let thoughtPending=null;
function choose(i){if(state.result||thinking)return;state.pending=i;sound();document.querySelectorAll('[data-choice]').forEach(b=>{let active=+b.dataset.choice===i;b.setAttribute('aria-pressed',String(active));b.closest('.choice-card').classList.toggle('is-selected',active)});$('#selection-status').textContent='已選：'+chapters[state.index].options[i].zh;$('#submit-choice').disabled=false}
function submitChoice(){if(state.result||thinking||state.pending===undefined)return;performChoice(state.pending)}
function selectThought(buy){thoughtPending=buy;document.querySelectorAll('[data-think]').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.think==='buy')===buy)));$('#thought-status').textContent=buy?'已選：我需要它，買下':'已選：繼續用原有衣服';$('#thought-submit').disabled=false}
function submitThought(){if(thoughtPending===null||state.result)return;finishThink(thoughtPending);thoughtPending=null}
function applyTextSize(){let pct=Math.max(80,Math.min(150,Number(prefs.textSize)||100));prefs.textSize=pct;document.documentElement.style.setProperty('--text-scale',pct/100);document.documentElement.style.setProperty('font-size',pct+'%');document.querySelector('#text-size').textContent=pct+'%'}
function adjustText(step){prefs.textSize=Math.max(80,Math.min(150,(Number(prefs.textSize)||100)+step));applyTextSize();try{localStorage.setItem('shirt-prefs',JSON.stringify(prefs))}catch(e){}}

let replayTimer;
function replay(){clearTimeout(replayTimer);let i=0;const original=structuredClone(state);modal.style.width='min(760px,94vw)';function show(){const c=chapters[i],o=chosen(c.key,original);let partial=structuredClone(original);partial.index=i;partial.result=true;partial.choices=Object.fromEntries(chapters.slice(0,i+1).map(ch=>[ch.key,original.choices[ch.key]]));const old=state;state=partial;modal.innerHTML=`<div class="eyebrow">YOUR JOURNEY · ${i+1} / 9</div><h3>${c.zh} — ${o.zh}</h3><div class="sub">${c.title} · ${o.en}</div>${art(c)}<p style="margin:15px 0;font-size:23px">${o.zh}</p><p class="sub">${o.line}</p><button class="primary" id="replaynext">${i===8?'結束回顧':'下一幕 →'}</button> <button id="replayclose">關閉</button>`;state=old;$('#replaynext').onclick=()=>{clearTimeout(replayTimer);if(i===8)modal.close();else{i++;show()}};$('#replayclose').onclick=()=>modal.close();if(i<8)replayTimer=setTimeout(()=>{if(modal.open){i++;show()}},4000)}show();modal.showModal()}
modal.addEventListener('close',()=>{clearTimeout(replayTimer);modal.style.width=''});
$('#settings').onclick=openSettings;$('#home').onclick=()=>{sound();lobby()};$('#full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){$('#full').textContent='Use browser full screen'}};
document.addEventListener('visibilitychange',()=>{if(ac){if(document.hidden)ac.suspend();else ac.resume()}});
try{let s=JSON.parse(localStorage.getItem('shirt-save')||'null');if(s?.state&&s.state.index>=0&&s.state.index<=9){state=s.state;baseline=s.baseline;state.page='lobby'}}catch(e){}applyTextSize();lobby();
</script></body></html>
